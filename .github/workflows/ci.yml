name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to full commit SHAs (same pins as LakeScan).
# macos-14 is an Apple Silicon (arm64) runner. The ort crate downloads the ONNX
# Runtime binaries at build time; the built app makes no network calls.
jobs:
  quality-gates:
    name: Quality gates
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Gate 1 - formatting
        run: cargo fmt --all -- --check

      - name: Gate 2 - clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Gate 3 - check
        run: cargo check --all-targets --all-features

      - name: Gate 4 - tests
        run: cargo test --all-features

      - name: Gate 5 - release build
        run: cargo build --release
